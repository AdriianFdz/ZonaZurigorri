version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: zona-zurigorri-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-zona_zurigorri}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zona-zurigorri-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: zona-zurigorri-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - zona-zurigorri-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth Service (NestJS)
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: zona-zurigorri-auth-service
    environment:
      PORT: ${APP_PORT_AUTH_SERVICE:-5001}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_DATABASE: ${POSTGRES_DB:-zona_zurigorri}
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key-change-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:8000/api/auth/google/callback}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_CALLBACK_URL: ${DISCORD_CALLBACK_URL:-http://localhost:8000/api/auth/discord/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS_AUTH_SERVICE}
    ports:
      - "${APP_PORT_AUTH_SERVICE:-5001}:${APP_PORT_AUTH_SERVICE:-5001}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zona-zurigorri-network
    restart: unless-stopped

  # Main Logic Service (FastAPI)
  main-logic-service:
    build:
      context: ./main-logic-service
      dockerfile: Dockerfile
    container_name: zona-zurigorri-main-logic-service
    command: sh -c "python -m uvicorn app.main:app --host $${HOST_MAIN_LOGIC_SERVICE:-0.0.0.0} --port $${APP_PORT_MAIN_LOGIC_SERVICE:-5000}"
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_DATABASE: ${POSTGRES_DB:-zona_zurigorri}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS_MAIN_LOGIC_SERVICE}
      HOST: "${HOST_MAIN_LOGIC_SERVICE:-0.0.0.0}"
      APP_PORT: ${APP_PORT_MAIN_LOGIC_SERVICE:-5000}
    ports:
      - "${APP_PORT_MAIN_LOGIC_SERVICE:-5000}:${APP_PORT_MAIN_LOGIC_SERVICE:-5000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zona-zurigorri-network
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: zona-zurigorri-frontend
    ports:
      - "${APP_PORT_FRONTEND:-3000}:${APP_PORT_FRONTEND:-3000}"
    depends_on:
      - auth-service
      - main-logic-service
    networks:
      - zona-zurigorri-network
    restart: unless-stopped

  # Kong API Gateway
  kong:
    image: kong:3.5
    container_name: zona-zurigorri-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    ports:
      - "8000:8000"  # Proxy
      - "8443:8443"  # Proxy SSL
      - "8002:8001"  # Admin API
    volumes:
      - ./kong-gateway/kong-local.yml:/usr/local/kong/declarative/kong.yml:ro
    depends_on:
      - auth-service
      - main-logic-service
    networks:
      - zona-zurigorri-network
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

networks:
  zona-zurigorri-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
